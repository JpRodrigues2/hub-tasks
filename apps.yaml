# Catálogo de apps do hub: projeto da ferramenta → pasta → contexto → gamificações.
# projetos_na_ferramenta usa IDs (estáveis); o nome vai no comentário.
# Apps com projetos_na_ferramenta vazio não recebem tasks (ficam disponíveis só em "Escolher outro").
# Gamificações: só nome, servidor e conta. NUNCA credenciais (apiKey/secretKey ficam nos projetos).
#   O João vai preencher as gamificações conta por conta depois da última fase. Até lá, o hub
#   NÃO despacha tasks da Funifier de apps com `gamificacoes: []` (avisa no Telegram).
# Como adicionar um projeto novo: veja "Adicionando novos projetos ao hub" no ROADMAP_HUB.md.

